<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roue des émotions</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f7f4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .app {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
      padding: 2rem 1.5rem;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 20px; font-weight: 600; color: #2c2c2a; margin-bottom: 0.25rem; }
    .subtitle { font-size: 13px; color: #aaa; margin-bottom: 1.25rem; }
    .instruction { font-size: 15px; color: #555; margin-bottom: 0.75rem; min-height: 24px; font-weight: 500; }

    .progress { display: flex; justify-content: center; gap: 5px; margin-bottom: 0.4rem; flex-wrap: wrap; }
    .progress-dot { width: 8px; height: 8px; border-radius: 50%; background: #e8e6e0; transition: background 0.3s; }
    .progress-dot.done { background: #1D9E75; }
    .progress-label { font-size: 11px; color: #bbb; margin-bottom: 1rem; min-height: 16px; }

    .wheel-wrapper {
      position: relative; width: 320px; height: 320px;
      margin: 0 auto 1.25rem; cursor: pointer; user-select: none;
    }
    .wheel-needle {
      position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 12px solid transparent; border-right: 12px solid transparent;
      border-top: 30px solid #D85A30;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2)); z-index: 10;
    }
    .wheel-pulse {
      position: absolute; inset: -8px; border-radius: 50%;
      border: 3px solid #1D9E75; opacity: 0; pointer-events: none;
    }
    .wheel-wrapper.idle .wheel-pulse { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse {
      0% { transform: scale(0.96); opacity: 0.5; }
      70% { transform: scale(1.06); opacity: 0; }
      100% { transform: scale(0.96); opacity: 0; }
    }
    canvas { border-radius: 50%; display: block; }
    .tap-hint {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #fff; border-radius: 50%; width: 56px; height: 56px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      pointer-events: none; transition: opacity 0.3s;
    }
    .result-card {
      background: #f8f7f4; border-radius: 16px; padding: 1.25rem 1.5rem;
      margin: 0 auto 0.75rem; max-width: 360px;
      display: none; flex-direction: column; align-items: center; gap: 8px;
    }
    .result-emotion { font-size: 26px; font-weight: 700; color: #2c2c2a; }
    .result-definition { font-size: 13px; color: #999; font-style: italic; line-height: 1.5; margin: 0; display: none; }
    .result-question { font-size: 14px; color: #555; line-height: 1.6; margin: 0; font-weight: 500; }
    .result-hint { font-size: 12px; color: #bbb; margin-top: 4px; }
    .footer { margin-top: 1rem; font-size: 11px; color: #bbb; }
  </style>
</head>
<body>
<div class="app">
  <h1>Roue des émotions</h1>
  <p class="subtitle">Tape sur la roue pour la faire tourner</p>
  <p class="instruction" id="instr">👇 Tape sur la roue !</p>
  <div class="progress" id="progressDots"></div>
  <p class="progress-label" id="progressLabel"></p>

  <div class="wheel-wrapper idle" id="wheelWrapper" onclick="spin()">
    <div class="wheel-pulse"></div>
    <div class="wheel-needle"></div>
    <canvas id="wheelCanvas" width="320" height="320"></canvas>
    <div class="tap-hint" id="tapHint">👆</div>
  </div>

  <div class="result-card" id="resultCard">
    <span class="result-emotion" id="resultEmotion"></span>
    <p class="result-definition" id="resultDefinition"></p>
    <p class="result-question" id="resultQuestion"></p>
    <p class="result-hint">👆 Tape sur la roue pour continuer</p>
  </div>

  <p class="footer">patriciapsy.fr</p>
</div>

<script>
const emotions = [
  {
    mot: "Frustrée",
    definition: "La frustration c'est quand on veut quelque chose et qu'on ne peut pas l'avoir.",
    question: "Est-ce que tu vois des moments comme ça dans ta vie ?",
    color: "#F5C4B3"
  },
  {
    mot: "Joyeuse",
    definition: "",
    question: "Qu'est-ce qui t'a rendue joyeuse récemment ?",
    color: "#C0DD97"
  },
  {
    mot: "Seule",
    definition: "",
    question: "Est-ce qu'il y a des moments où tu te sens seule, même entourée de gens ?",
    color: "#B5D4F4"
  },
  {
    mot: "Fière",
    definition: "",
    question: "De quoi tu es fière en ce moment, même d'une toute petite chose ?",
    color: "#9FE1CB"
  },
  {
    mot: "En colère",
    definition: "",
    question: "Est-ce qu'il y a quelque chose qui t'a mise en colère dernièrement ?",
    color: "#F7C1C1"
  },
  {
    mot: "Légère",
    definition: "",
    question: "Est-ce qu'il y a des moments où tu te sens légère, sans souci ? C'est quoi ces moments ?",
    color: "#FFF0A0"
  },
  {
    mot: "Honteuse",
    definition: "La honte c'est quand on a peur que les autres nous jugent ou nous trouvent ridicules, et qu'on voudrait disparaître.",
    question: "Est-ce que tu as déjà ressenti ça ?",
    color: "#E8C4E8"
  },
  {
    mot: "Soulagée",
    definition: "",
    question: "Y a-t-il quelque chose dont tu t'es sentie soulagée récemment ?",
    color: "#FAC775"
  },
  {
    mot: "Inquiète",
    definition: "",
    question: "Est-ce qu'il y a quelque chose qui t'inquiète en ce moment ?",
    color: "#AFA9EC"
  },
  {
    mot: "Déçue",
    definition: "",
    question: "Est-ce qu'il y a quelqu'un ou quelque chose qui t'a déçue récemment ?",
    color: "#F4C0D1"
  },
  {
    mot: "Triste",
    definition: "",
    question: "Est-ce que tu peux me parler d'un moment où tu t'es sentie triste ?",
    color: "#A8D4F0"
  },
  {
    mot: "Débordée",
    definition: "Débordée c'est quand il y a trop de choses en même temps et qu'on ne sait plus par où commencer.",
    question: "Est-ce que tu reconnais ça dans ta vie en ce moment ?",
    color: "#C8E6C9"
  }
];

const N = emotions.length;
const SLICE = (2 * Math.PI) / N;

let spinning = false;
let currentAngle = 0;
let deck = [], done = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function refillDeck() { deck = shuffle([...Array(N).keys()]); done = []; }
function nextFromDeck() { if (!deck.length) refillDeck(); return deck.pop(); }

function drawWheel(angle) {
  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const cx = 160, cy = 160, r = 148;
  ctx.clearRect(0, 0, 320, 320);
  emotions.forEach((e, i) => {
    const start = angle + i * SLICE - Math.PI / 2;
    const end   = angle + (i + 1) * SLICE - Math.PI / 2;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = e.color; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2; ctx.stroke();
    const mid = angle + (i + 0.5) * SLICE - Math.PI / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(mid);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#333';
    ctx.font = '600 12px -apple-system, sans-serif';
    ctx.fillText(e.mot, r - 10, 4);
    ctx.restore();
  });
  ctx.beginPath(); ctx.arc(cx, cy, 24, 0, 2 * Math.PI);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.06)'; ctx.lineWidth = 1; ctx.stroke();
}

function getWinnerIndex(angle) {
  let needle = ((-angle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
  return Math.floor(needle / SLICE) % N;
}

function updateProgress() {
  const dots = document.getElementById('progressDots');
  const label = document.getElementById('progressLabel');
  dots.innerHTML = '';
  for (let i = 0; i < N; i++) {
    const d = document.createElement('div');
    d.className = 'progress-dot' + (i < done.length ? ' done' : '');
    dots.appendChild(d);
  }
  if (!done.length) label.textContent = '';
  else if (done.length === N) label.textContent = '✨ Toutes les émotions explorées ! La roue se renouvelle...';
  else label.textContent = done.length + ' sur ' + N + ' émotions explorées';
}

function spin() {
  if (spinning) return;
  spinning = true;

  document.getElementById('wheelWrapper').classList.remove('idle');
  document.getElementById('tapHint').style.opacity = '0';
  document.getElementById('instr').textContent = 'La roue tourne...';
  document.getElementById('resultCard').style.display = 'none';

  const targetIdx = nextFromDeck();
  done.push(targetIdx);

  const targetAngleInWheel = (targetIdx + 0.5) * SLICE;
  const minSpins = (4 + Math.random()) * 2 * Math.PI;
  let base = -targetAngleInWheel;
  while (base < currentAngle + minSpins) base += 2 * Math.PI;
  const finalAngle = base;

  const duration = 3800;
  const startTime = performance.now();
  const startAngle = currentAngle;
  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function animate(now) {
    const t = Math.min((now - startTime) / duration, 1);
    currentAngle = startAngle + (finalAngle - startAngle) * easeOut(t);
    drawWheel(currentAngle);
    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      currentAngle = finalAngle;
      drawWheel(currentAngle);
      spinning = false;
      updateProgress();
      if (done.length === N) setTimeout(() => { refillDeck(); updateProgress(); }, 2500);
      const realWinner = getWinnerIndex(currentAngle);
      setTimeout(() => showResult(realWinner), 500);
    }
  }
  requestAnimationFrame(animate);
}

function showResult(idx) {
  const e = emotions[idx];
  document.getElementById('resultEmotion').textContent = e.mot;
  const defEl = document.getElementById('resultDefinition');
  if (e.definition) {
    defEl.textContent = e.definition;
    defEl.style.display = 'block';
  } else {
    defEl.style.display = 'none';
  }
  document.getElementById('resultQuestion').textContent = e.question;
  document.getElementById('resultCard').style.display = 'flex';
  document.getElementById('instr').textContent = '';
  document.getElementById('wheelWrapper').classList.add('idle');
  document.getElementById('tapHint').style.opacity = '1';
}

refillDeck();
updateProgress();
drawWheel(0);
</script>
</body>
</html>
